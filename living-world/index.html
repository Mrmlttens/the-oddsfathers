function makeName(rng= rnd){return placeParts[Math.floor(rng()*placeParts.length)]+placeEnds[Math.floor(rng()*placeEnds.length)]}
function logEvent(w,type,message,position=null){w.events.unshift({year:Math.floor(w.year),type,message,lat:position?.lat??null,lon:position?.lon??null});if(w.events.length>180)w.events.length=180;}
function findLand(seed,rng,tries=500){for(let i=0;i<tries;i++){let lat=Math.asin(rng()*1.8-.9),lon=rng()*TAU-PI;if(terrain(lat,lon,seed).land)return {lat,lon}}return {lat:0,lon:0}}

function initialWorld(which){const seed=Math.floor(rnd()*2147483647),rng=seeded(seed+7),w={version:1,kind:which,seed,name:makeName(rng)+' Prime',year:1,created:Date.now(),lastSaved:Date.now(),kingdoms:[],settlements:[],events:[],artifacts:[],wars:0,checkpoint:null,alienArrivals:0,marks:[],conditions:[],nextId:1};let sites=[];

 const kingdom={id:kid,name:name+' '+(['Kingdom','Clans','Dominion','Covenant','Realm','Union'][i]),race,pop:Math.floor(80+rng()*120),food:100,wood:80,ore:25,tech:Math.floor(rng()*3)+1,army:18+rng()*15,stability:65+rng()*30,ambition:rng(),traits:[],leader:pick(firstNames)+' '+name,leaderAge:22+Math.floor(rng()*32),wars:0,color:raceColors[race],culture:race};
 w.kingdoms.push(kingdom);w.settlements.push({id:w.nextId++,name,lat:pos.lat,lon:pos.lon,kingdom:kid,level:1,pop:kingdom.pop,established:1});}

function saveWorld(w){if(!w)return;w.lastSaved=Date.now();try{localStorage.setItem(keys[w.kind],JSON.stringify(w));return true}catch(e){console.warn('Save failed',e);return false}}

function kingdomOf(id){return world.kingdoms.find(k=>k.id===id)}
function getPop(w){return Math.round(w.kingdoms.reduce((a,k)=>a+k.pop,0))}
function simulateYear(w){w.year++;const s=w.settlements,ks=w.kingdoms,year=Math.floor(w.year),r=rnd();if(!ks.length)return;
 for(const k of ks){const towns=s.filter(x=>x.kingdom===k.id);let env=towns.reduce((a,t)=>a+terrain(t.lat,t.lon,w.seed).moist,0)/Math.max(1,towns.length);

 k.pop=Math.max(0,Math.round(k.pop+delta));k.food=clamp(k.food+(env-.45)*18+k.tech*.35-k.pop*.0015,0,350);

 k.wood=clamp(k.wood+rnd()*9,0,1500);k.ore=clamp(k.ore+rnd()*3,0,900);
 k.army=clamp(k.pop*(.045+k.ambition*.035),2,Math.max(2,k.pop*.12));

 if(k.leaderAge>68&&rnd()<.015){k.stability=clamp(k.stability-2,1,100)}

function advanceYears(n,onDone){if(jumping)return;jumping=true;const target=Math.floor(n);let i=0;$('timeStatus').textContent='Advancing history…';function batch(){let max=Math.min(target-i,500);for(let j=0;j<max;j++)simulateYear(world);i+=max;updateUI();if(i<target){$('tip').textContent=`Simulating year ${Math.floor(world.year).toLocaleString()} · ${Math.floor(100*i/target)}%`;setTimeout(batch,0)}else{jumping=false;saveWorld(world);$('tip').textContent=`Advanced ${target.toLocaleString()} years. Open Chronicle to see what changed.`;toast(`History advanced ${target.toLocaleString()} years`);if(onDone)onDone();}}batch()}

// ---------- GPU sphere renderer. No third-party dependencies ----------
const vs=`attribute vec2 a_xy;varying vec2 v_xy;void main(){v_xy=a_xy;gl_Position=vec4(a_xy,0.,1.);}`;
const fs=`precision highp float;varying vec2 v_xy;uniform sampler2D u_map;uniform mat3 u_inv;uniform float u_dist;uniform float u_aspect;uniform float u_time;uniform float u_seed;

// Permanent geographic scars are burned into the planet texture, not just announced in a toast.
function blendSurfaceMark(tex,mark){

 const c=palette[mark.type]||palette.meteor,rad=mark.radius||.12,lat0=mark.lat,lon0=mark.lon;

function commandTarget(raw){let lower=raw.toLowerCase(),sites=world.settlements;

 let mention=world.kingdoms.find(k=>lower.includes(k.name.toLowerCase())||lower.includes(k.name.split(' ')[0].toLowerCase()));
 if(mention)return sites.find(s=>s.kingdom===mention.id)||sites[0];
 if(/weakest|poorest|smallest/.test(lower)){let k=[...world.kingdoms].sort((a,b)=>a.pop-b.pop)[0];return sites.find(s=>s.kingdom===k.id)||sites[0];}
 if(/strongest|largest|richest|greatest/.test(lower)){let k=[...world.kingdoms].sort((a,b)=>b.pop-a.pop)[0];return sites.find(s=>s.kingdom===k.id)||sites[0];}

 if(/southern|south/.test(lower)){return [...sites].sort((a,b)=>a.lat-b.lat)[0];}

function alphaDrawSprite(id,x,y,size,ctx2=ctx){if(!alphaAtlas.complete||!alphaAtlas.naturalWidth)return false;const index={house:0,shop:1,market:2,castle:3,tree:4,pine:5,field:6,tower:7,ruins:8,dragon:9}[id];if(index===undefined)return false;const n=192;ctx2.drawImage(alphaAtlas,(index%5)*n,Math.floor(index/5)*n,n,n,x-size*.5,y-size*.68,size,size);return true;}

// Geography-scale heraldry. This makes each inhabited region identifiable without
// relying on small abstract dots and keeps labels sparse on mobile screens.
const alphaOrigMarkers=renderMarkers;
renderMarkers=function(time){alphaOrigMarkers(time);if(!world||zoom<=2.03)return;
 let capitalIds=new Set();for(const k of world.kingdoms){const towns=world.settlements.filter(s=>s.kingdom===k.id);if(towns.length)capitalIds.add(towns.sort((a,b)=>a.established-b.established)[0].id)}
 const capitals=world.settlements.filter(s=>capitalIds.has(s.id)).map(s=>({s,p:project(s.lat,s.lon),k:findKingdom(world,s.kingdom)})).filter(o=>o.p&&o.p.x>20&&o.p.x<innerWidth-20&&o.p.y>190&&o.p.y<innerHeight-198).sort((a,b)=>b.s.pop-a.s.pop).slice(0,8);
 ctx.save();for(const {s,p,k} of capitals){const x=p.x,y=p.y+Math.sin(time*.0018+s.id)*2.2,iconScale=zoom>3.5?48:42;
  ctx.fillStyle='#080e18b8';ctx.beginPath();ctx.ellipse(x,y+13,19,7,0,0,TAU);ctx.fill();
  ctx.fillStyle=k?.color||'#d7b77d';ctx.beginPath();ctx.arc(x,y-10,19,0,TAU);ctx.fill();
  ctx.fillStyle='#142332';ctx.beginPath();ctx.arc(x,y-10,16,0,TAU);ctx.fill();
  const imageId=s.level>=3?'castle':s.level>=2?'tower':'house';
  if(!alphaDrawSprite(imageId,x,y-11,iconScale)){ctx.fillStyle='#f3db9d';ctx.fillText('♜',x-8,y-7)}
  const label=(k?.name||s.name).split(' ').slice(0,2).join(' ');ctx.font='600 10px Georgia,serif';ctx.textAlign='center';const width=Math.min(118,ctx.measureText(label).width+14);
  ctx.fillStyle='#0b1421d9';ctx.strokeStyle='#9d7d52b0';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x-width/2,y+17,width,20,5);ctx.fill();ctx.stroke();ctx.fillStyle='#f8e9c4';ctx.fillText(label,x,y+30);
 }
 ctx.restore();};
