(function(root){
 'use strict';
 const ZONES=[
  ['upperChest','Upper chest','front'],['lowerChest','Mid / lower chest','front'],

  ['glutes','Glutes','back'],['hamstrings','Hamstrings','back'],['calves','Calves','both']
 ];
 // Primary muscle receives full credit; secondary receives partial credit, visibly labelled.
 const DEFAULT={Chest:['lowerChest','upperChest','frontDelts','triceps'],Back:['lats','midBack','biceps','rearDelts'],Shoulders:['sideDelts','frontDelts','rearDelts','traps'],Biceps:['biceps','forearms'],Triceps:['triceps'],Quads:['quads','glutes','adductors'],Hamstrings:['hamstrings','glutes'],Glutes:['glutes','hamstrings'],Calves:['calves'],Core:['abs','obliques']};
 const SPEC={
  'incline-db':['upperChest','frontDelts','triceps'],'incline-bar':['upperChest','frontDelts','triceps'],'smith-incline':['upperChest','frontDelts','triceps'],
  'bench-press':['lowerChest','upperChest','triceps','frontDelts'],'flat-db':['lowerChest','upperChest','triceps'],'chest-press':['lowerChest','triceps','frontDelts'],'pec-deck':['lowerChest','upperChest'],'chest-fly':['lowerChest','upperChest'],dips:['lowerChest','triceps'],'pushups':['lowerChest','triceps','frontDelts'],
  'lat-pulldown':['lats','biceps','midBack'],'neutral-pulldown':['lats','biceps','midBack'],pullups:['lats','biceps','midBack'],chinups:['lats','biceps','midBack'],
  'barbell-row':['midBack','lats','biceps','rearDelts'],'cable-row':['midBack','lats','biceps','rearDelts'],'chest-row':['midBack','lats','biceps','rearDelts'],'db-row':['lats','midBack','biceps'],'tbar-row':['midBack','lats','biceps'],'machine-row':['midBack','lats','biceps'],'straight-pulldown':['lats'],deadlift:['lowerBack','glutes','hamstrings','traps'],

  'lateral-raise':['sideDelts'],'cable-lateral':['sideDelts'],'reverse-fly':['rearDelts','midBack'],'face-pull':['rearDelts','traps','midBack'],'rear-delt':['rearDelts'],'front-raise':['frontDelts'],shrugs:['traps'],'upright-row':['sideDelts','traps'],

  'triceps-pushdown':['triceps'],'overhead-triceps':['triceps'],skullcrusher:['triceps'],'close-grip':['triceps','lowerChest'],'triceps-dips':['triceps'],'kickback':['triceps'],'bench-dips':['triceps'],
  squat:['quads','glutes','adductors'],'front-squat':['quads','glutes'],'leg-press':['quads','glutes','adductors'],'hack-squat':['quads','glutes'],'pendulum-squat':['quads','glutes'],'goblet-squat':['quads','glutes'],'split-squat':['quads','glutes','adductors'],'leg-extension':['quads'],lunges:['quads','glutes'],'step-ups':['quads','glutes'],
  rdl:['hamstrings','glutes','lowerBack'],'db-rdl':['hamstrings','glutes','lowerBack'],'leg-curl':['hamstrings'],'lying-curl':['hamstrings'],'nordic-curl':['hamstrings'],
  'hip-thrust':['glutes','hamstrings'],'glute-bridge':['glutes'],'cable-kickback':['glutes'],
  'calf-raise':['calves'],'seated-calf':['calves'],'single-calf':['calves'],
  crunch:['abs'],'hanging-raise':['abs'],'plank':['abs','obliques'],'ab-wheel':['abs'],'russian-twist':['obliques'],'woodchop':['obliques']
 };
 const ZMAP=Object.fromEntries(ZONES.map(([id,label,side])=>[id,{id,label,side}]));
 function groupsFor(exercise){if(!exercise||exercise.muscle==='Cardio')return[];return SPEC[exercise.id]||DEFAULT[exercise.muscle]||[]}
 function analyze(workouts,exerciseLookup,now=Date.now()){
  const map=Object.fromEntries(ZONES.map(([id,label,side])=>[id,{id,label,side,status:'untracked',days:null,last:null,sets:0,secondaryOnly:false}]));
  for(const workout of workouts||[]){const t=Date.parse(workout.endedAt);if(!Number.isFinite(t)||t>now)continue;
   for(const entry of workout.exercises||[]){const groups=groupsFor(exerciseLookup(entry.id));if(!groups.length)continue;
    const sets=(entry.sets||[]).filter(s=>s.done!==false).length;if(!sets)continue;
    groups.forEach((id,i)=>{const z=map[id];if(!z)return; const effect=i===0?sets:sets*.4;if(effect<.35)return;
     z.sets+=effect;if(z.last===null||t>z.last){z.last=t;z.secondaryOnly=i!==0}else if(t===z.last&&i===0)z.secondaryOnly=false;
    });
   }
  }
  for(const z of Object.values(map)){
   if(z.last===null)continue;
   z.days=Math.max(0,Math.floor((now-z.last)/86400000));
   z.status=z.days<2?'hot':z.days<7?'warm':z.days<14?'neutral':'cold';
  }
  const counts={hot:0,warm:0,neutral:0,cold:0,untracked:0};Object.values(map).forEach(z=>counts[z.status]++);
  return {zones:map,counts,cold:Object.values(map).filter(z=>z.status==='cold').sort((a,b)=>b.days-a.days),hot:Object.values(map).filter(z=>z.status==='hot'),total:ZONES.length};
 }
 root.PQ_ANATOMY={ZONES,groupsFor,analyze};
})(typeof window!=='undefined'?window:globalThis);

  const w=state.workouts.find(x=>x.id===selectedWorkoutId);title=esc(w?.name||'WORKOUT');content=w?`<div class="eyebrow">${fmtDate(w.endedAt)}</div><p class="sub">${(w.exercises||[]).length} exercises · ${totalSets(w)} sets${w.source==='hevy'?' · Imported from Hevy':''}</p>${w.notes?`<p class="footnote">${esc(w.notes)}</p>`:''}<div class="pq-detail-list">${w.exercises.map(e=>`<div class="pq-detail-row"><strong>${esc(ex(e.id).name)}</strong><small>${e.sets.map(t=>`${t.weight} ${state.profile.units} × ${t.reps}${t.type==='warmup'?' (warm-up)':''}`).join(' · ')}</small></div>`).join('')}</div><div class="close-actions">${btn('repeatWorkout','REPEAT SESSION','primary full')}${btn('deleteWorkout','DELETE RECORD','outline danger')}</div>`:'<p>Record not found.</p>';
 } else if(modal==='discard'){title='DISCARD WORKOUT?';content=`<p class="sub">This session has not been completed. Your logged sets will be lost.</p><div class="close-actions">${btn('discardConfirm','DISCARD','outline danger')}${btn('modalClose','KEEP TRAINING','primary full')}</div>`}
 $('#modal-root').innerHTML=`<div class="modal-backdrop" data-action="modalBackdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-top"><h2>${title}</h2><button class="icon-btn" data-action="modalClose" aria-label="Close modal">×</button></div>${content}</div></div>`;
 }
 function exerciseResults(entries){return entries.length?entries.map(x=>`<button class="ex-result" data-action="selectExercise" data-id="${esc(x.id)}"><span class="ex-bubble">${x.muscle==='Cardio'?'↗':'◈'}</span><span><strong>${esc(x.name)}</strong><small>${esc(x.muscle)} · ${esc(x.equipment)}</small></span><span class="ex-arrow">${modal==='library'?'⌕':'+'}</span></button>`).join(''):'<p class="empty-state">No matches. Try a different keyword or create your own exercise.</p>'}
 function routineEditorEntries(){return editingRoutine.exercises.length?editingRoutine.exercises.map((x,i)=>`<div class="edit-entry"><span><strong>${esc(ex(x.id).name)}</strong><br><small>${esc(ex(x.id).muscle)}</small></span><div><small>SETS</small><br><input aria-label="Sets" type="number" min="1" max="12" data-edit="sets" data-index="${i}" value="${x.sets}"></div><div><small>MIN</small><br><input aria-label="Minimum reps" type="number" min="1" max="100" data-edit="min" data-index="${i}" value="${x.min}"></div><div><small>MAX</small><br><input aria-label="Maximum reps" type="number" min="1" max="100" data-edit="max" data-index="${i}" value="${x.max}"></div><div><small>REST</small><br><input aria-label="Rest seconds" type="number" min="0" max="600" data-edit="rest" data-index="${i}" value="${x.rest}"></div><div class="pq-reorder"><button class="icon-btn" data-action="moveRoutineExercise" data-dir="up" data-index="${i}" aria-label="Move exercise up" ${i===0?'disabled':''}>↑</button><button class="icon-btn" data-action="moveRoutineExercise" data-dir="down" data-index="${i}" aria-label="Move exercise down" ${i===editingRoutine.exercises.length-1?'disabled':''}>↓</button><button class="icon-btn" data-action="removeRoutineExercise" data-index="${i}" aria-label="Remove exercise">×</button></div></div>`).join(''):'<p class="tiny-text">No exercises yet. Add some below.</p>'}
 function go(v){view=v;preview=false;closeModal();render();window.scrollTo({top:0,behavior:'instant'})}
 function makeWorkout(r){if(state.activeWorkout){toast('Finish your current workout first');go('train');return}state.activeWorkout={id:uid(),name:r?.name||'QUICK WORKOUT',startedAt:new Date().toISOString(),notes:'',exercises:(r?.exercises||[]).map(x=>({id:x.id,min:x.min,max:x.max,rest:x.rest,sets:Array.from({length:Number(x.sets)||3},()=>({weight:'',reps:'',type:'normal',done:false}))}))};save();go('train')}
 function finishWorkout(){const active=state.activeWorkout;if(!active)return;const exercises=active.exercises.map(e=>({...e,sets:e.sets.filter(x=>x.done&&x.reps!==''&&Number(x.reps)>0&&Number(x.weight)>=0).map(x=>({weight:Number(x.weight)||0,reps:Number(x.reps)||0,type:x.type||'normal'}))})).filter(e=>e.sets.length);const sets=exercises.reduce((n,e)=>n+e.sets.length,0);if(!sets){toast('Complete at least one set first');return}let prs=0;for(const e of exercises){const prior=state.workouts.flatMap(w=>w.exercises.filter(x=>x.id===e.id).flatMap(x=>x.sets.map(s=>Number(s.weight)*Number(s.reps))));const best=Math.max(0,...prior);if(prior.length&&e.sets.some(s=>s.weight*s.reps>best))prs++}const working=exercises.reduce((n,e)=>n+e.sets.filter(x=>x.type!=='warmup').length,0);const xp=Math.min(250,80+working*10+prs*15);const priorLevel=levelState().lvl;state.profile.totalXp+=xp;const newLevel=levelState().lvl;state.workouts.unshift({...active,exercises,endedAt:new Date().toISOString(),earnedXp:xp});state.activeWorkout=null;restUntil=0;state.restUntil=0;preview=false;save();window._lastSummary={xp,sets,exercises:exercises.length,prs,levelUp:newLevel>priorLevel?newLevel:0};view='home';render();openModal('finish')}
 function download(name,text,type){if(window.PumpQuestNative?.saveFile){const bytes=new TextEncoder().encode(text);let binary='';for(let k=0;k<bytes.length;k+=8192)binary+=String.fromCharCode(...bytes.subarray(k,k+8192));window.PumpQuestNative.saveFile(name,type,btoa(binary));toast('Choose a folder to save your backup');return}const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`Downloaded ${name}`)}
 function exportCSV(){const rows=[['Date','Workout','Exercise','Muscle','Equipment','Set','Weight','Units','Reps','Workout XP']];for(const w of state.workouts){for(const entry of w.exercises){entry.sets.forEach((s,i)=>rows.push([w.endedAt,w.name,ex(entry.id).name,ex(entry.id).muscle,ex(entry.id).equipment,i+1,s.weight,state.profile.units,s.reps,w.earnedXp]))}}download('pumpquest-workouts.csv',rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
 function importJSON(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{const file=f.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(reader.result);if(payload.version!==1||!payload.profile||!Array.isArray(payload.workouts)||!Array.isArray(payload.routines))throw Error('Invalid backup');if(!window.confirm('Replace ALL current local PumpQuest data with this backup?'))return;state={...newState(),...payload};state.activeWorkout=null;save();go('home');toast('Backup restored successfully')}catch{toast('Invalid PumpQuest JSON backup')}};reader.readAsText(file)};f.click()}
 function importHevy(){const f=document.createElement('input');f.type='file';f.accept='.csv,text/csv';f.onchange=()=>{const file=f.files?.[0];if(!file)return;if(file.size>20*1024*1024){toast('Hevy CSV must be under 20 MB');return}const reader=new FileReader();reader.onload=()=>{try{const batch=IMP.toWorkouts(String(reader.result),E,state.customExercises,state.workouts,state.profile.units);if(!window.confirm(`Import ${batch.workouts.length} sessions and ${batch.importedSets} sets from Hevy? Existing PumpQuest workouts will be kept. Imported workouts do not award XP.`))return;const copy=structuredClone(state);copy.customExercises.push(...batch.customExercises);copy.workouts.push(...batch.workouts);copy.workouts.sort((a,b)=>Date.parse(b.endedAt)-Date.parse(a.endedAt));localStorage.setItem(KEY,JSON.stringify(copy));state=copy;closeModal();render();toast(`Imported ${batch.workouts.length} Hevy workouts`)}catch(error){toast(error?.message||'Could not import Hevy CSV')}};reader.readAsText(file)};f.click()}
 // Delegated event handlers: fast, efficient and work for every screen/modal.
 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
  if(action==='modalBackdrop'){if(e.target===el&&modal!=='finish')closeModal();return}
  if(action==='modalClose'){closeModal();return}
  if(action==='nav'){e.preventDefault();go(el.dataset.view);return}
  if(action==='startQuick'){if(state.activeWorkout){go('train')}else makeWorkout();return}
  if(action==='startRoutine'){makeWorkout(state.routines.find(x=>x.id===el.dataset.id));return}
  if(action==='newRoutine'){editingRoutine={id:null,name:'NEW ROUTINE',tag:'',color:'mint',exercises:[]};openModal('routineEditor');return}
  if(action==='editRoutine'){const r=state.routines.find(x=>x.id===el.dataset.id);if(r){editingRoutine=structuredClone(r);openModal('routineEditor')}return}
  if(action==='saveRoutine'){editingRoutine.name=($('#routine-name')?.value||'').trim();editingRoutine.tag=($('#routine-tag')?.value||'').trim();if(!editingRoutine.name){toast('Give your routine a name');return}for(const entry of editingRoutine.exercises){if(entry.max<entry.min){toast('Rep range max must be at least min');return}}if(!editingRoutine.id){editingRoutine.id=uid();state.routines.push(editingRoutine)}else{const i=state.routines.findIndex(x=>x.id===editingRoutine.id);state.routines[i]=editingRoutine}save();closeModal();render();toast('Routine saved!');return}
  if(action==='deleteRoutine'){if(window.confirm('Delete this saved routine? Completed workouts will be kept.')){state.routines=state.routines.filter(r=>r.id!==editingRoutine.id);save();closeModal();render();toast('Routine removed')}return}
  if(action==='removeRoutineExercise'){editingRoutine.exercises.splice(Number(el.dataset.index),1);renderModal();return}
  if(action==='moveRoutineExercise'){const i=Number(el.dataset.index),j=i+(el.dataset.dir==='up'?-1:1);if(i>=0&&j>=0&&j<editingRoutine.exercises.length){const [entry]=editingRoutine.exercises.splice(i,1);editingRoutine.exercises.splice(j,0,entry);renderModal()}return}
  if(action==='pickerRoutine'){const name=$('#routine-name')?.value,tag=$('#routine-tag')?.value;if(name!=null)editingRoutine.name=name;if(tag!=null)editingRoutine.tag=tag;pickerTarget='routine';exerciseSearch='';exerciseMuscle='All';openModal('exercisePicker');return}
  if(action==='pickerWorkout'){pickerTarget='workout';exerciseSearch='';exerciseMuscle='All';openModal('exercisePicker');return}
  if(action==='library'){openModal('library');return}
  if(action==='filterMuscle'){exerciseMuscle=el.dataset.muscle;const input=$('#exercise-search');exerciseSearch=input?.value||exerciseSearch;renderModal();$('#exercise-search')?.focus();return}
  if(action==='selectExercise'){const id=el.dataset.id;if(modal==='library'){const x=ex(id);toast(`${x.name} · ${x.muscle} · ${x.equipment}`);return}if(pickerTarget==='routine'){editingRoutine.exercises.push({id,sets:3,min:8,max:12,rest:90});openModal('routineEditor')}else if(state.activeWorkout){state.activeWorkout.exercises.push({id,min:8,max:12,rest:90,sets:Array.from({length:3},()=>({weight:'',reps:'',type:'normal',done:false}))});save();closeModal();render();toast('Exercise added')}return}
  if(action==='createCustomExercise'){const name=$('#custom-ex-name')?.value.trim();const muscle=$('#custom-ex-muscle')?.value;const equipment=$('#custom-ex-equipment')?.value;if(!name){toast('Enter an exercise name');return}const id='custom-'+uid();state.customExercises.push({id,name,muscle,equipment});save();if(modal==='library'){toast('Custom exercise created');exerciseSearch=name;renderModal()}else{if(pickerTarget==='routine'){editingRoutine.exercises.push({id,sets:3,min:8,max:12,rest:90});openModal('routineEditor')}else{state.activeWorkout.exercises.push({id,min:8,max:12,rest:90,sets:Array.from({length:3},()=>({weight:'',reps:'',type:'normal',done:false}))});save();closeModal();render()}}return}
  if(action==='toggleSet'){const entry=state.activeWorkout?.exercises[Number(el.dataset.index)];const s=entry?.sets[Number(el.dataset.set)];if(!s)return;if(!s.done&&(s.reps===''||Number(s.reps)<=0||s.weight===''||Number(s.weight)<0)){toast('Enter a valid weight and at least 1 rep (0 weight for bodyweight)');return}s.done=!s.done;if(s.done)rest(entry.rest||90);save();render();return}
  if(action==='addSet'){const entry=state.activeWorkout.exercises[Number(el.dataset.index)];const last=entry.sets.at(-1)||{};entry.sets.push({weight:last.weight??'',reps:last.reps??'',type:last.type||'normal',done:false});save();render();return}
  if(action==='removeExercise'){if(window.confirm('Remove this exercise from your active workout?')){state.activeWorkout.exercises.splice(Number(el.dataset.index),1);save();render()}return}
  if(action==='restNow'){rest(Number(el.dataset.secs)||90);toast('Rest timer started');return}
  if(action==='finishWorkout'){finishWorkout();return}
  if(action==='removeSet'){const entry=state.activeWorkout?.exercises[Number(el.dataset.index)];if(entry&&entry.sets.length>1){entry.sets.pop();save();render()}return}
  if(action==='cancelWorkout'){openModal('discard');return}
  if(action==='discardConfirm'){state.activeWorkout=null;restUntil=0;state.restUntil=0;save();go('train');toast('Workout discarded');return}
  if(action==='goHome'){go('home');return}
  if(action==='preview'){preview=!preview;render();return}
  if(action==='openAnatomy'){go('history');return}
  if(action==='anatomySide'){anatomySide=el.dataset.side==='back'?'back':'front';render();return}
  if(action==='anatomyZone'){anatomySelected=el.dataset.zone;render();return}
  if(action==='muscle'){const m=el.dataset.muscle;toast((getPumps()[m]?`${m}: pump level ${getPumps()[m]} of 3`:`${m}: train this muscle to activate its glow`));return}
  if(action==='species'){const next=el.dataset.species;if(!['bruiser','shell','kaiju'].includes(next))return;state.profile.species=next;save();render();toast(document.body.classList.contains('pq-webgl-fallback')?'Character saved · 3D needs WebGL':heroLabel()+' selected');return}
  if(action==='color'){state.profile.color=el.dataset.color;save();render();return}
  if(action==='saveName'){const val=$('#char-name')?.value.trim();if(!val){toast('Enter a champion name');return}state.profile.name=val.toUpperCase();save();render();toast('Champion renamed');return}
  if(action==='equip'){const item=ITEMS.find(x=>x.id===el.dataset.item);if(!item||item.level>levelState().lvl)return;state.profile.equipped[item.category]=state.profile.equipped[item.category]===item.id?'base':item.id;save();render();return}
  if(action==='workoutDetails'){selectedWorkoutId=el.dataset.id;openModal('workoutDetails');return}
  if(action==='deleteWorkout'){const w=state.workouts.find(x=>x.id===selectedWorkoutId);if(w&&window.confirm(`Delete ${w.name}? This can’t be undone without a backup.`)){state.workouts=state.workouts.filter(x=>x.id!==w.id);state.profile.totalXp=Math.max(0,state.profile.totalXp-(w.earnedXp||0));save();closeModal();render();toast('Record deleted')}return}
  if(action==='repeatWorkout'){const w=state.workouts.find(x=>x.id===selectedWorkoutId);if(!w)return;const routine={name:w.name,exercises:w.exercises.map(x=>({id:x.id,sets:x.sets.length||3,min:8,max:12,rest:90}))};closeModal();makeWorkout(routine);return}
  if(action==='importHevy'){importHevy();return}
  if(action==='install'){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice?.finally?.(()=>{deferredInstall=null})}else toast('Open Chrome menu → Add to Home screen to install PumpQuest');return}
  if(action==='settings'){openModal('settings');const sel=document.getElementById('pq-quality');if(sel){try{sel.value=localStorage.getItem('pq-render-quality')==='balanced'?'balanced':'cinematic'}catch{sel.value='cinematic'}}return}
  if(action==='exportJSON'){download('pumpquest-backup.json',JSON.stringify(state,null,2),'application/json');return}
  if(action==='exportCSV'){exportCSV();return}
  if(action==='importJSON'){importJSON();return}
 });
 document.addEventListener('input',e=>{const el=e.target;if(el.id==='exercise-search'){exerciseSearch=el.value;const entries=[...E,...state.customExercises].filter(x=>(exerciseMuscle==='All'||x.muscle===exerciseMuscle)&&`${x.name} ${x.equipment} ${x.muscle}`.toLowerCase().includes(exerciseSearch.toLowerCase())).slice(0,65);$('#exercise-results').innerHTML=exerciseResults(entries);return}if(el.id==='workout-title'&&state.activeWorkout){state.activeWorkout.name=el.value;save();return}if(el.id==='workout-notes'&&state.activeWorkout){state.activeWorkout.notes=el.value.slice(0,3000);save();return}if(el.dataset.input&&state.activeWorkout){const set=state.activeWorkout.exercises[Number(el.dataset.index)]?.sets[Number(el.dataset.set)];if(set){set[el.dataset.input]=el.value;save()}return}if(el.dataset.edit&&editingRoutine){const obj=editingRoutine.exercises[Number(el.dataset.index)];if(obj)obj[el.dataset.edit]=Math.max(0,Number(el.value)||0)}});
 document.addEventListener('change',e=>{if(e.target.id==='weight-unit'){const v=e.target.value;if(v!==state.profile.units){const f=v==='kg'?1/2.2046226218:2.2046226218;const convert=(set)=>{if(set.weight!==''&&set.weight!==null&&Number.isFinite(Number(set.weight)))set.weight=String(Math.round(Number(set.weight)*f*100)/100)};for(const w of state.workouts)for(const x of w.exercises)for(const set of x.sets)convert(set);for(const x of state.activeWorkout?.exercises||[])for(const set of x.sets)convert(set);state.profile.units=v;save();render();toast('Weights converted to '+v)}}if(e.target.id==='pq-quality'){const mode=e.target.value==='balanced'?'balanced':'cinematic';try{localStorage.setItem('pq-render-quality',mode)}catch{}window.pqHero3d?.setQuality?.(mode);toast('3D quality: '+mode);return}if(e.target.id==='weekly-goal'){state.profile.weeklyGoal=Math.max(2,Math.min(7,Number(e.target.value)||4));save();toast('Weekly goal saved')}});
 document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.anatomy-zone')){e.preventDefault();anatomySelected=e.target.dataset.zone;render();return}if(e.key==='Escape'&&modal&&modal!=='finish')closeModal()});
 window.PQ_APP_BACK=()=>{if(modal){closeModal();return true}if(view!=='home'){go('home');return true}return false};
 window.addEventListener?.('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e});
 setInterval(()=>{const timer=$('#rest-timer');if(timer)timer.textContent=restUntil>Date.now()?`REST ${timeFmt(Math.ceil((restUntil-Date.now())/1000))}`:'NO REST TIMER'},1000);
 render();
 // The 3D canvas is persistent: switching to a logging overlay never destroys the hero.
 try{
   if(window.PQ3D){window.pqHero3d=window.PQ3D.create(document.getElementById('pq3d-canvas'));window.pqHero3d.setCharacter(state.profile.species);window.pqHero3d.setMode(heroEffect());window.pqHero3d.setZones(anatomyData().zones,currentPumpZones());window.pqHero3d.setGear?.(state.profile.equipped);window.pqHero3d.setAccent?.(state.profile.color);window.pqHero3d.setQuality?.((()=>{try{return localStorage.getItem('pq-render-quality')==='balanced'?'balanced':'cinematic'}catch{return 'cinematic'}})());document.body.classList.add('pq-webgl-ready')}
 }catch(err){console.warn('PumpQuest: hardware 3D unavailable; displaying accessible static fallback.',err);document.body.classList.add('pq-webgl-fallback')}
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
