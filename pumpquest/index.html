 function train(){if(!state.activeWorkout){return `<section class="page"><div class="pagehead"><div><div class="eyebrow">TRAINING ZONE</div><h1>Let's get stronger.</h1><p class="sub">Pick a routine or build a session on the fly.</p></div></div>${btn('startQuick','⚡ START EMPTY WORKOUT','primary full')}<h2 class="block-title">YOUR ROUTINES</h2><div class="section-grid">${state.routines.map(r=>`<div class="panel"><div class="flexline"><div><h3>${esc(r.name)}</h3><p>${r.exercises.length} exercises · ${esc(r.tag||'Custom')}</p></div>${btn('startRoutine','START →','tiny ghost','data-id="'+esc(r.id)+'"')}</div></div>`).join('')}</div><h2 class="block-title">EXERCISE LIBRARY</h2><p class="sub">Search, filter, and explore exercises before your session.</p>${btn('library','🔍 BROWSE EXERCISES','ghost mt')}</section>`}

s="exercise-footer">${btn('addSet','+ ADD SET','tiny ghost','data-index="'+index+'"')}<div style="display:flex;align-items:center;gap:8px"><span class="tiny-text">Rest: ${entry.rest||90}s</span>${btn('restNow','◷','tiny outline','data-secs="'+(entry.rest||90)+'"')}</div></div></div>`).join('')}${btn('pickerWorkout','+ ADD EXERCISE','ghost full mt')}<div class="bottom-tools">${btn('cancelWorkout','DISCARD','outline')}${btn('finishWorkout','✓ FINISH WORKOUT','primary')}</div></section>`;

 function history(){const total=state.workouts.length,sets=state.workouts.reduce((s,w)=>s+totalSets(w),0),xp=state.profile.totalXp;const days=Array.from({length:7},(_,i)=>daysAgo(6-i)),counts=days.map(d=>state.workouts.filter(w=>localDay(w.endedAt)===d).length),max=Math.max(1,...counts);return `<section class="page"><div class="pagehead"><div><div class="eyebrow">REAL PROGRESS. REAL POWER.</div><h1>Training stats.</h1><p class="sub">Your workout history and consistency at a glance.</p></div>${btn('exportCSV','↓ EXPORT','ghost')}</div><div class="metrics"><div class="metric"><div class="metric-number">${total}</div><div class="metric-label">Workouts</div></div><div class="metric"><div class="metric-number">${sets}</div><div class="metric-label">Total sets</div></div><div class="metric"><div class="metric-number">${xp.toLocaleString()}</div><div class="metric-label">Total XP</div></div></div><div class="card mt2"><div class="statrow"><h3>This week's training</h3><small>Completed sessions</small></div><div class="bars">${days.map((d,i)=>`<div class="bar-wrap"><div class="bar-track" style="height:${Math.max(3,Math.round(counts[i]/max*90))}%;opacity:${counts[i]?'1':'.19'}" title="${d}: ${counts[i]} workouts"></div><span class="bar-label">${['S','M','T','W','T','F','S'][new Date(d+'T12:00:00').getDay()]}</span></div>`).join('')}</div></div><h2 class="block-title">Workout history</h2>${total?state.workouts.map(w=>`<div class="history-item"><span class="history-symbol">⚡</span><div class="history-data"><strong>${esc(w.name)}</strong><small>${fmtDate(w.endedAt)} · ${totalSets(w)} sets · ${w.exercises.length} exercises</small></div><span class="xp-tag">+${w.earnedXp} XP</span></div>`).join(''):`<div class="empty-state"><span class="empty-glyph">◈</span><strong>Your story starts with one rep.</strong><p>Finish your first workout to start tracking progress and lighting up your character.</p>${btn('startQuick','START TRAINING','primary')}</div>`}${anatomyPanel()}<div class="card  function locker(){const ls=levelState();return `<section class="page"><div class="pagehead"><div><div class="eyebrow">THE CHARACTER LAB</div><h1>Make it legendary.</h1><p class="sub">Every hero has its own body, silhouette and elemental effects. Tap to equip instantly.</p></div></div><div class="character-config"><div><div class="card"><div class="statrow"><h3>Choose a 3D champion</h3><span class="pill">LVL ${ls.lvl}</span></div><div class="champion-roster mt">${[['bruiser','STORMHORN','Thunder and mountain smoke','⚡'],['shell','ABYSS WARDEN','Ocean light and living water','◉'],['kaiju','CINDER DRAKE','Molten embers and fire','✦']].map(([s,n,desc,symbol])=>`<button class="roster-card ${state.profile.species===s?'selected':''}" data-action="species" data-species="${s}" aria-pressed="${state.profile.species===s}"><span class="roster-crest roster-${s}">${symbol}</span><span class="roster-copy"><strong>${n}</strong><small>${desc}</small></span><span class="roster-check">${state.profile.species===s?'✓ ACTIVE':'SELECT'}</span></button>`).join('')}</div><p class="footnote">Three different original 3D bodies. Switch whenever you like—your workouts, XP and gear remain yours.</p><h3 class="mt2">Aura glow</h3><div class="color-grid mt">${[['lime','#c6ff7d'],['teal','#72f6ed'],['pink','#fe8db6'],['amber','#ffc27c']].map(([name,c])=>`<button class="color-dot ${state.profile.color===name?'selected':''}" style="background:${c}" data-action="color" data-color="${name}" aria-label="${name} glow"></button>`).join('')}</div><div class="field mt2"><label for="char-name">Champion name</label><input maxlength="26" id="char-name" value="${esc(state.profile.name)}"></div>${btn('saveName','SAVE NAME','ghost full')}</div><div class="card mt"><div class="statrow"><h3>Loot locker</h3><small>Earn gear by leveling</small></div><div class="inventory mt">${ITEMS.filter(x=>x.id!=='base').map(item=>{const unlocked=ls.lvl>=item.level;const equipped=state.profile.equipped?.[item.category]===item.id;r  function routineEditorEntries(){return editingRoutine.exercises.length?editingRoutine.exercises.map((x,i)=>`<div class="edit-entry"><span><strong>${esc(ex(x.id).name)}</strong><br><small>${esc(ex(x.id).muscle)}</small></span><div><small>SETS</small><br><input aria-label="Sets" type="number" min="1" max="12" data-edit="sets" data-index="${i}" value="${x.sets}"></div><div><small>MIN</small><br><input aria-label="Minimum reps" type="number" min="1" max="100" data-edit="min" data-index="${i}" value="${x.min}"></div><div><small>MAX</small><br><input aria-label="Maximum reps" type="number" min="1" max="100" data-edit="max" data-index="${i}" value="${x.max}"></div><div><small>REST</small><br><input aria-label="Rest seconds" type="number" min="0" max="600" data-edit="rest" data-index="${i}" value="${x.rest}"></div><button class="icon-btn" data-action="removeRoutineExercise" data-index="${i}" aria-label="Remove exercise">×</button></div>`).join(''):'<p class="tiny-text">No exercises yet. Add some below.</p>'}
 function go(v){view=v;preview=false;closeModal();render();window.scrollTo({top:0,behavior:'instant'})}
 function makeWorkout(r){if(state.activeWorkout){toast('Finish your current workout first');go('train');return}state.activeWorkout={id:uid(),name:r?.name||'QUICK WORKOUT',startedAt:new Date().toISOString(),exercises:(r?.exercises||[]).map(x=>({id:x.id,min:x.min,max:x.max,rest:x.rest,sets:Array.from({length:Number(x.sets)||3},()=>({weight:'',reps:'',done:false}))}))};save();go('train')}
 function finishWorkout(){const active=state.activeWorkout;if(!active)return;const exercises=active.exercises.map(e=>({...e,sets:e.sets.filter(x=>x.done&&x.reps!==''&&Number(x.reps)>=0&&Number(x.weight)>=0).map(x=>({weight:Number(x.weight)||0,reps:Number(x.reps)||0}))})).filter(e=>e.sets.length);const sets=exercises.reduce((n,e)=>n+e.sets.length,0);if(!sets){toast('Complete at least one set first');return}let prs=0;for(const e of exercises){const prior=state.workouts.flatMap(w=>w.exercises.filter(x=>x.id===e.id).flatMap(x=>x.sets.map(s=>Number(s.weight)*Number(s.reps))));const best=Math.max(0,...prior);if(prior.length&&e.sets.some(s=>s.weight*s.reps>best))prs++}const xp=Math.min(250,100+sets*8+prs*15);const priorLevel=levelState().lvl;state.profile.totalXp+=xp;const newLevel=levelState().lvl;state.workouts.unshift({...active,exercises,endedAt:new Date().toISOString(),earnedXp:xp});state.activeWorkout=null;restUntil=0;preview=false;save();window._lastSummary={xp,sets,exercises:exercises.length,prs,levelUp:newLevel>priorLevel?newLevel:0};view='home';render();openModal('finish')}
 function download(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(`Downloaded ${name}`)}
 function exportCSV(){const rows=[['Date','Workout','Exercise','Muscle','Equipment','Set','Weight','Units','Reps','Workout XP']];for(const w of state.workouts){for(const entry of w.exercises){entry.sets.forEach((s,i)=>rows.push([w.endedAt,w.name,ex(entry.id).name,ex(entry.id).muscle,ex(entry.id).equipment,i+1,s.weight,state.profile.units,s.reps,w.earnedXp]))}}download('pumpquest-workouts.csv',rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv')}
 function importJSON(){const f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=()=>{const file=f.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const payload=JSON.parse(reader.result);if(payload.version!==1||!payload.profile||!Array.isArray(payload.workouts)||!Array.isArray(payload.routines))throw Error('Invalid backup');if(!window.confirm('Replace ALL current local PumpQuest data with this backup?'))return;state={...newState(),...payload};state.activeWorkout=null;save();go('home');toast('Backup restored successfully')}catch{toast('Invalid PumpQuest JSON backup')}};reader.readAsText(file)};f.click()}
 // Delegated event handlers: fast, efficient and work for every screen/modal.
 document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
  if(action==='modalBackdrop'){if(e.target===el&&modal!=='finish')closeModal();return}
  if(action==='modalClose'){closeModal();return}
  if(action==='nav'){e.preventDefault();go(el.dataset.view);return}
  if(action==='startQuick'){if(state.activeWorkout){go('train')}else makeWorkout();return}
  if(action==='startRoutine'){makeWorkout(state.routines.find(x=>x.id===el.dataset.id));return}
  if(action==='newRoutine'){editingRoutine={id:null,name:'NEW ROUTINE',tag:'',color:'mint',exercises:[]};openModal('routineEditor');return}
  if(action==='editRoutine'){const r=state.routines.find(x=>x.id===el.dataset.id);if(r){editingRoutine=structuredClone(r);openModal('routineEditor')}return}
  if(action==='saveRoutine'){editingRoutine.name=($('#routine-name')?.value||'').trim();editingRoutine.tag=($('#routine-tag')?.value||'').trim();if(!editingRoutine.name){toast('Give your routine a name');return}for(const entry of editingRoutine.exercises){if(entry.max<entry.min){toast('Rep range max must be at least min');return}}if(!editingRoutine.id){editingRoutine.id=uid();state.routines.push(editingRoutine)}else{const i=state.routines.findIndex(x=>x.id===editingRoutine.id);state.routines[i]=editingRoutine}save();closeModal();render();toast('Routine saved!');return}
  if(action==='deleteRoutine'){if(window.confirm('Delete this saved routine? Completed workouts will be kept.')){state.routines=state.routines.filter(r=>r.id!==editingRoutine.id);save();closeModal();render();toast('Routine removed')}return}
  if(action==='removeRoutineExercise'){editingRoutine.exercises.splice(Number(el.dataset.index),1);renderModal();return}
  if(action==='pickerRoutine'){const name=$('#routine-name')?.value,tag=$('#routine-tag')?.value;if(name!=null)editingRoutine.name=name;if(tag!=null)editingRoutine.tag=tag;pickerTarget='routine';exerciseSearch='';exerciseMuscle='All';openModal('exercisePicker');return}
  if(action==='pickerWorkout'){pickerTarget='workout';exerciseSearch='';exerciseMuscle='All';openModal('exercisePicker');return}
  if(action==='library'){openModal('library');return}
  if(action==='filterMuscle'){exerciseMuscle=el.dataset.muscle;const input=$('#exercise-search');exerciseSearch=input?.value||exerciseSearch;renderModal();$('#exercise-search')?.focus();return}
  if(action==='selectExercise'){const id=el.dataset.id;if(modal==='library'){const x=ex(id);toast(`${x.name} · ${x.muscle} · ${x.equipment}`);return}if(pickerTarget==='routine'){editingRoutine.exercises.push({id,sets:3,min:8,max:12,rest:90});openModal('routineEditor')}else if(state.activeWorkout){state.activeWorkout.exercises.push({id,min:8,max:12,rest:90,sets:Array.from({length:3},()=>({weight:'',reps:'',done:false}))});save();closeModal();render();toast('Exercise added')}return}
  if(action==='createCustomExercise'){const name=$('#custom-ex-name')?.value.trim();const muscle=$('#custom-ex-muscle')?.value;const equipment=$('#custom-ex-equipment')?.value;if(!name){toast('Enter an exercise name');return}const id='custom-'+uid();state.customExercises.push({id,name,muscle,equipment});save();if(modal==='library'){toast('Custom exercise created');exerciseSearch=name;renderModal()}else{if(pickerTarget==='routine'){editingRoutine.exercises.push({id,sets:3,min:8,max:12,rest:90});openModal('routineEditor')}else{state.activeWorkout.exercises.push({id,min:8,max:12,rest:90,sets:Array.from({length:3},()=>({weight:'',reps:'',done:false}))});save();closeModal();render()}}return}
  if(action==='toggleSet'){const entry=state.activeWorkout?.exercises[Number(el.dataset.index)];const s=entry?.sets[Number(el.dataset.set)];if(!s)return;if(!s.done&&(s.reps===''||Number(s.reps)<0||s.weight===''||Number(s.weight)<0)){toast('Enter your weight and reps first (0 for bodyweight)');return}s.done=!s.done;if(s.done)restUntil=Date.now()+(entry.rest||90)*1000;save();render();return}
  if(action==='addSet'){const entry=state.activeWorkout.exercises[Number(el.dataset.index)];const last=entry.sets.at(-1)||{};entry.sets.push({weight:last.weight??'',reps:last.reps??'',done:false});save();render();return}
  if(action==='removeExercise'){if(window.confirm('Remove this exercise from your active workout?')){state.activeWorkout.exercises.splice(Number(el.dataset.index),1);save();render()}return}
  if(action==='restNow'){restUntil=Date.now()+Number(el.dataset.secs)*1000;toast('Rest timer started');return}
  if(action==='finishWorkout'){finishWorkout();return}
  if(action==='cancelWorkout'){openModal('discard');return}
  if(action==='discardConfirm'){state.activeWorkout=null;restUntil=0;save();go('train');toast('Workout discarded');return}
  if(action==='goHome'){go('home');return}
  if(action==='preview'){preview=!preview;render();return}
  if(action==='openAnatomy'){go('history');return}
  if(action==='anatomySide'){anatomySide=el.dataset.side==='back'?'back':'front';render();return}
  if(action==='anatomyZone'){anatomySelected=el.dataset.zone;render();return}
  if(action==='muscle'){const m=el.dataset.muscle;toast((getPumps()[m]?`${m}: pump level ${getPumps()[m]} of 3`:`${m}: train this muscle to activate its glow`));return}
  if(action==='species'){const next=el.dataset.species;if(!['bruiser','shell','kaiju'].includes(next))return;state.profile.species=next;save();render();toast(document.body.classList.contains('pq-webgl-fallback')?'Character saved · 3D needs WebGL':heroLabel()+' selected');return}
  if(action==='color'){state.profile.color=el.dataset.color;save();render();return}
  if(action==='saveName'){const val=$('#char-name')?.value.trim();if(!val){toast('Enter a champion name');return}state.profile.name=val.toUpperCase();save();render();toast('Champion renamed');return}
  if(action==='equip'){const item=ITEMS.find(x=>x.id===el.dataset.item);if(!item||item.level>levelState().lvl)return;state.profile.equipped[item.category]=state.profile.equipped[item.category]===item.id?'base':item.id;save();render();return}
  if(action==='settings'){openModal('settings');return}
  if(action==='exportJSON'){download('pumpquest-backup.json',JSON.stringify(state,null,2),'application/json');return}
  if(action==='exportCSV'){exportCSV();return}
  if(action==='importJSON'){importJSON();return}
 });
 document.addEventListener('input',e=>{const el=e.target;if(el.id==='exercise-search'){exerciseSearch=el.value;const entries=[...E,...state.customExercises].filter(x=>(exerciseMuscle==='All'||x.muscle===exerciseMuscle)&&`${x.name} ${x.equipment} ${x.muscle}`.toLowerCase().includes(exerciseSearch.toLowerCase())).slice(0,65);$('#exercise-results').innerHTML=exerciseResults(entries);return}if(el.id==='workout-title'&&state.activeWorkout){state.activeWorkout.name=el.value;save();return}if(el.dataset.input&&state.activeWorkout){const set=state.activeWorkout.exercises[Number(el.dataset.index)]?.sets[Number(el.dataset.set)];if(set){set[el.dataset.input]=el.value;save()}return}if(el.dataset.edit&&editingRoutine){const obj=editingRoutine.exercises[Number(el.dataset.index)];if(obj)obj[el.dataset.edit]=Math.max(0,Number(el.value)||0)}});
 document.addEventListener('change',e=>{if(e.target.id==='weight-unit'){state.profile.units=e.target.value;save();toast('Weight unit label updated')}});
 document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.anatomy-zone')){e.preventDefault();anatomySelected=e.target.dataset.zone;render();return}if(e.key==='Escape'&&modal&&modal!=='finish')closeModal()});
 setInterval(()=>{const timer=$('#rest-timer');if(timer)timer.textContent=restUntil>Date.now()?`REST ${timeFmt(Math.ceil((restUntil-Date.now())/1000))}`:'NO REST TIMER'},1000);
 render();
 // The 3D canvas is persistent: switching to a logging overlay never destroys the hero.
 try{
   if(window.PQ3D){window.pqHero3d=window.PQ3D.create(document.getElementById('pq3d-canvas'));window.pqHero3d.setCharacter(state.profile.species);window.pqHero3d.setMode(heroEffect());window.pqHero3d.setZones(anatomyData().zones,{});document.body.classList.add('pq-webgl-ready')}
 }catch(err){console.warn('PumpQuest: hardware 3D unavailable; displaying accessible static fallback.',err);document.body.classList.add('pq-webgl-fallback')}
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
