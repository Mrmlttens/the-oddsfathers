name: Save final results and publish
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 0-7,16-23 * * *'
  push:
    branches: [main]
    paths:
      - 'bets.json'
      - 'game-model.js'
      - 'king-model.js'
      - 'scripts/sync-results.cjs'
      - '.github/workflows/results.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: verified-results-and-pages
  cancel-in-progress: false
jobs:
  records:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify scoring and grade final ESPN results
        run: |
          node tests/models.test.cjs
          node tests/refactor.test.cjs
          node scripts/sync-results.cjs
      - name: Preserve final results
        id: save
        run: |
          git config user.name "oddsfathers-results[bot]"
          git config user.email "oddsfathers-results[bot]@users.noreply.github.com"
          git add king.json
          if ! git diff --cached --quiet; then
            git commit -m "Save verified ESPN final grades and corrections"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
      - name: Stage public app
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p _site
          cp index.html *.js *.css *.json stadium-header.webp _site/
          cp -r v2 _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      - name: Publish current records
        id: deploy
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4

